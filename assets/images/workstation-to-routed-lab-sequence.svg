  <text x="1198" y="500" fill="#e5eefc" font-family="Segoe UI, Arial, sans-serif" font-size="21">Default gateway</text>
  <text x="1198" y="538" fill="#e5eefc" font-family="Segoe UI, Arial, sans-serif" font-size="21">Inter-subnet traffic</text>
